[workspace]
resolver = "3"
members = [
    "crates/delve-core",
    "crates/delve-game",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "EUPL-1.2"

[workspace.dependencies]
bevy = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
